<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Români UK</title>
<style>:root{--fundal:#F1F5FB;--text:#0F1826;--moale:#3C4C66;--accent:#1F63D0;--linie:#D7E1EF}
@media (prefers-color-scheme:dark){
:root{--fundal:#0E1A2D;--text:#E9F0FA;--moale:#B3C2D8;--accent:#6BA6F6;--linie:#2D4364}}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundal);color:var(--text);
font:17px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:44rem;margin:0 auto;padding:28px 16px 72px}
h1{font-size:1.8rem;line-height:1.25;margin:0 0 .75rem}
h2{font-size:1.3rem;line-height:1.3;margin:2.25rem 0 .5rem;padding-top:1.25rem;
border-top:1px solid var(--linie)}
h3{font-size:1.05rem;margin:1.5rem 0 .25rem}
p,li{color:var(--moale)}
strong{color:var(--text)}
a{color:var(--accent);overflow-wrap:anywhere}
ul,ol{padding-left:1.4rem}
li{margin:.35rem 0}</style>
</head>
<body>
<main>
<h1>Români UK</h1>
<p>Documentele aplicației Români UK:</p>
<ul>
<li><a href="https://x1ray-f.github.io/romani-uk/termeni/">Termeni și condiții</a></li>
<li><a href="https://x1ray-f.github.io/romani-uk/confidentialitate/">Politica de confidențialitate</a></li>
<li><a href="https://x1ray-f.github.io/romani-uk/stergere/">Ștergerea datelor</a></li>
</ul>
<p>Pentru întrebări sau ca să ne ceri ceva despre datele tale: <a href="mailto:flaviuseduard17@gmail.com">flaviuseduard17@gmail.com</a></p>
</main>
</body>
</html>
